<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12150d">
<title>OVERVIEW — 3D Tour</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
</head>
<body>

<div class="app">

  <!-- ============ KHUNG NHÌN ============ -->
  <canvas id="framesView" class="viewer" aria-label="Exterior view, 360-degree rotation"></canvas>

  <div id="planView" class="viewer viewer--plan" hidden>
    <img id="planImage" alt="Floor plan" draggable="false">
  </div>

  <!-- Khung xem toàn cảnh 360° (Pannellum) -->
  <div id="panoView" class="viewer viewer--pano" hidden></div>

  <div class="vignette" aria-hidden="true"></div>

  <!-- ============ HUD ============ -->
  <button id="menuBtn" class="menu-btn" type="button"
          aria-label="Open scene list" aria-expanded="false" aria-controls="drawer">
    <img src="assets/ui/menu.png" alt="MENU" draggable="false">
  </button>

  <div class="scene-tag">
    <span class="scene-tag__idx" id="sceneIdx">01</span>
    <span class="scene-tag__name" id="sceneName">OVERVIEW</span>
  </div>

  <!-- Gợi ý thao tác -->
  <div class="hint" id="hint">
    <svg class="hint__ico" viewBox="0 0 24 40" width="16" height="27" aria-hidden="true">
      <rect x="1.2" y="1.2" width="21.6" height="37.6" rx="10.8" fill="none" stroke="currentColor" stroke-width="2.2"/>
      <rect class="hint__dot" x="10" y="7" width="4" height="9" rx="2" fill="currentColor"/>
    </svg>
    <span class="hint__txt" id="hintText">SCROLL TO ROTATE</span>
  </div>

  <!-- Chuyển chế độ xem -->
  <div class="modebar" id="modebar" role="tablist" aria-label="View mode">
    <button class="mode" data-mode="360" role="tab" type="button" aria-selected="true">EXTERIOR</button>
    <button class="mode" data-mode="pano" role="tab" type="button" aria-selected="false">INTERIOR 360</button>
  </div>

  <!-- Chuyển ảnh trong mục NỘI THẤT -->
  <div class="imgbar" id="imgbar" role="group" aria-label="Switch interior image" hidden>
    <button class="nav-btn" id="prevBtn" type="button" data-nav="-1" aria-label="Previous image">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button class="nav-btn" id="nextBtn" type="button" data-nav="1" aria-label="Next image">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.4"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- Màn hình chờ -->
  <div class="loader" id="loader">
    <div class="loader__brand">3D TOUR</div>
    <div class="loader__bar"><i id="loaderBar"></i></div>
    <div class="loader__pct"><span id="loaderPct">0</span><small>%</small></div>
  </div>

  <div class="notice" id="notice" hidden></div>

  <!-- ============ MENU ============ -->
  <div class="scrim" id="scrim" hidden></div>

  <aside class="drawer" id="drawer" aria-hidden="true" aria-label="Scene list">
    <div class="drawer__head">
      <span class="drawer__title">SCENES</span>
      <button class="drawer__close" id="drawerClose" type="button" aria-label="Close list">✕</button>
    </div>
    <nav class="drawer__list" id="drawerList"></nav>
    <div class="drawer__foot">
      <span>Use the menu or the ← → keys to switch scenes</span>
    </div>
  </aside>

</div>

<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<script src="js/scenes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
